[tool:pytest]
# Redundant with pytest.ini — kept for IDE compatibility

[coverage:run]
source = apps
omit =
    */migrations/*
    */tests/*
    */__init__.py
    */admin.py
    */apps.py

[coverage:report]
show_missing = True
skip_covered = False
fail_under = 70

[flake8]
max-line-length = 100
exclude =
    migrations,
    .venv,
    venv,
    __pycache__

[isort]
profile = black
known_django = django
known_drf = rest_framework
sections = FUTURE,STDLIB,DJANGO,DRF,THIRDPARTY,FIRSTPARTY,LOCALFOLDER
