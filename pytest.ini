[pytest]
DJANGO_SETTINGS_MODULE = config.settings.testing
python_files = tests/*/test_*.py tests/test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --reuse-db
    --nomigrations
    -v
    --tb=short
    --cov=apps
    --cov-report=term-missing
    --cov-report=html:htmlcov
filterwarnings =
    ignore::DeprecationWarning
